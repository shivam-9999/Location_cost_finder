name: Deploy to Azure App Service

on:
  push:
    branches: [ "24thMarchRelease" ]
  pull_request:
    branches: [ "24thMarchRelease" ]

env:
  AZURE_WEBAPP_NAME: locationcostfinder
  PYTHON_VERSION: '3.10'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      env:
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        PORT: ${{ secrets.PORT }}
        SSLMODE: ${{ secrets.SSLMODE }}
        
    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput
      env:
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        PORT: ${{ secrets.PORT }}
        SSLMODE: ${{ secrets.SSLMODE }}
        DEBUG: 'False'
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ALLOWED_HOSTS: ${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
        
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: .
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        
    - name: Configure App Settings
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
            {
              "name": "DBNAME",
              "value": "${{ secrets.DBNAME }}"
            },
            {
              "name": "DBUSER",
              "value": "${{ secrets.DBUSER }}"
            },
            {
              "name": "DBPASSWORD",
              "value": "${{ secrets.DBPASSWORD }}"
            },
            {
              "name": "DBHOST",
              "value": "${{ secrets.DBHOST }}"
            },
            {
              "name": "PORT",
              "value": "${{ secrets.PORT }}"
            },
            {
              "name": "SSLMODE",
              "value": "${{ secrets.SSLMODE }}"
            },
            {
              "name": "DEBUG",
              "value": "False"
            },
            {
              "name": "ALLOWED_HOSTS",
              "value": "${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
            },
            {
              "name": "WEBSITES_PORT",
              "value": "8000"
            }
          ]
        
    - name: Run database migrations
      run: |
        python manage.py migrate
      env:
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        PORT: ${{ secrets.PORT }}
        SSLMODE: ${{ secrets.SSLMODE }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: False
        ALLOWED_HOSTS: ${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net 