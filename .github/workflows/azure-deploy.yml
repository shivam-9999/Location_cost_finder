name: Deploy to Azure

on:
  push:
    branches: [ "deploy-to-azure" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: locationcostfinder
  PYTHON_VERSION: '3.10'
  PORT: 8000
  WEBSITES_PORT: 8000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Create virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate

    - name: Install dependencies
      run: |
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Verify django-cors-headers installation
        pip show django-cors-headers

    - name: Verify Django installation
      run: |
        source venv/bin/activate
        python -c "import django; import corsheaders; print('Django version:', django.get_version()); print('CORS headers installed successfully')"

    - name: Collect static files
      run: |
        source venv/bin/activate
        python manage.py collectstatic --noinput
      env:
        DJANGO_SETTINGS_MODULE: server_location_map.settings
        DEBUG: 'False'
        ALLOWED_HOSTS: 'locationcostfinder.azurewebsites.net'
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PORT: 8000
        WEBSITES_PORT: 8000

    - name: Create deployment package
      run: |
        zip -r deploy.zip . -x "*.git*" "*.github*" "venv/*" "*.pytest_cache*" "__pycache__/*" "*.pyc"

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy.zip
      env:
        WEBSITES_PORT: 8000
        PORT: 8000
        DJANGO_SETTINGS_MODULE: server_location_map.settings
        DEBUG: 'False'
        ALLOWED_HOSTS: 'locationcostfinder.azurewebsites.net'
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SCM_DO_BUILD_DURING_DEPLOYMENT: true
        DOCKER_ENABLE_CI: true
        WEBSITES_CONTAINER_START_TIME_LIMIT: 600

    - name: Apply database migrations
      run: |
        source venv/bin/activate
        python manage.py migrate --noinput
      env:
        DJANGO_SETTINGS_MODULE: server_location_map.settings
        DEBUG: 'False'
        ALLOWED_HOSTS: 'locationcostfinder.azurewebsites.net'
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DBNAME: ${{ secrets.DBNAME }}
        DBUSER: ${{ secrets.DBUSER }}
        DBPASSWORD: ${{ secrets.DBPASSWORD }}
        DBHOST: ${{ secrets.DBHOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PORT: 8000
        WEBSITES_PORT: 8000 
