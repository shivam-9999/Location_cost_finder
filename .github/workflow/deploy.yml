name: Build and deploy Python app to Azure Web App - locationcostfinder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Log Environment Variables
        run: |
          echo "CLIENT ID: ${{ secrets.AZURE_CLIENT_ID }}"
          echo "TENANT ID: ${{ secrets.AZURE_TENANT_ID }}"
          echo "SUBSCRIPTION ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Debug Azure CLI Version
        run: |
          az version
      - name: Debug Azure Account Details
        run: |
          az account show || true  # Ensures this step does not block workflow if it fails
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'locationcostfinder'
          slot-name: 'Production'

      - name: Check Deployment Logs
        run: |
          az webapp log tail --name locationcostfinder --resource-group <YOUR_RESOURCE_GROUP> --timeout 300 || true