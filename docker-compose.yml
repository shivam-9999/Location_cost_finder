services:
  web:
    build: . # This tells Docker Compose to build from the local Dockerfile
    container_name: location_finder_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3 # Mount SQLite database
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=0.0.0.0,127.0.0.1,localhost
      - REDIS_URL=redis://redis:6379/0  # Point to Redis service
    command: >
      sh -c "echo '📜 Starting Django Application...' &&
             python manage.py migrate &&
             python manage.py setup_cache &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: location_finder_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:

